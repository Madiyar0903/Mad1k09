<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar System VR</title>
  <style>html, body { margin: 0; background: #02030a; }</style>
</head>
<body>
  <a-scene background="color: #02030a" renderer="colorManagement: true">
    <!-- Light -->
    <a-entity light="type: ambient; color: #445; intensity: 0.8"></a-entity>
    <a-entity position="0 1.5 -11" light="type: point; color: #fff2cc; intensity: 2.2; distance: 60; decay: 1"></a-entity>

    <!-- Everything is built by the script below -->
    <a-entity id="system" position="0 1.5 -11"></a-entity>
    <a-entity id="stars"></a-entity>

    <!-- Title in front of the viewer -->
    <a-text value="Solar System" position="0 2.6 -3" align="center" width="5" color="#ffffff"></a-text>
    <a-text value="Walk around and look closer" position="0 2.3 -3" align="center" width="3" color="#9aa7c7"></a-text>

    <!-- Camera at standing height (Quest uses real head position in VR) -->
    <a-entity id="rig" position="0 0 0">
      <a-camera position="0 1.6 0"></a-camera>
    </a-entity>
  </a-scene>

  <script>
    // name, orbit radius, planet size, color, orbit duration (ms)
    const planets = [
      { n: 'Mercury', r: 1.6, s: 0.10, c: '#a8a39a', t: 6000 },
      { n: 'Venus',   r: 2.4, s: 0.18, c: '#e0b47a', t: 9000 },
      { n: 'Earth',   r: 3.3, s: 0.20, c: '#3b7bd8', t: 12000, moon: true },
      { n: 'Mars',    r: 4.2, s: 0.14, c: '#c4553a', t: 16000 },
      { n: 'Jupiter', r: 5.7, s: 0.55, c: '#d1a77a', t: 24000 },
      { n: 'Saturn',  r: 7.3, s: 0.46, c: '#e3cf94', t: 30000, ring: true },
      { n: 'Uranus',  r: 8.7, s: 0.30, c: '#8fd8d8', t: 38000 },
      { n: 'Neptune', r: 9.8, s: 0.29, c: '#4a63d9', t: 46000 }
    ];

    function el(tag, attrs, parent) {
      const e = document.createElement(tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }

    function label(text, y, parent) {
      el('a-text', {
        value: text, align: 'center', width: 2.2, color: '#ffffff',
        position: '0 ' + y + ' 0', 'look-at': '[camera]'
      }, parent);
    }

    function init() {
      const system = document.getElementById('system');

      // Sun
      const sun = el('a-sphere', { radius: 0.9, material: 'shader: flat; color: #ffcc33' }, system);
      label('Sun', 1.3, sun);

      planets.forEach(p => {
        // Pivot at the sun that rotates, carrying the planet around it
        const pivot = el('a-entity', {
          animation: 'property: rotation; to: 0 360 0; dur: ' + p.t + '; easing: linear; loop: true'
        }, system);

        // Orbit line (thin ring on the floor plane of the system)
        el('a-ring', {
          'radius-inner': p.r - 0.01, 'radius-outer': p.r + 0.01,
          rotation: '-90 0 0', material: 'color: #3a4468; opacity: 0.5; transparent: true; side: double',
          segmentsTheta: 96
        }, system);

        const planet = el('a-sphere', {
          radius: p.s, position: p.r + ' 0 0',
          material: 'color: ' + p.c + '; roughness: 1'
        }, pivot);

        // Self rotation
        planet.setAttribute('animation__spin', 'property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true');

        label(p.n, p.s + 0.3, planet);

        if (p.ring) {
          el('a-ring', {
            'radius-inner': p.s * 1.4, 'radius-outer': p.s * 2.2,
            rotation: '-70 0 0', material: 'color: #cbb98a; side: double; opacity: 0.85; transparent: true'
          }, planet);
        }

        if (p.moon) {
          const moonPivot = el('a-entity', {
            animation: 'property: rotation; to: 0 360 0; dur: 3000; easing: linear; loop: true'
          }, planet);
          el('a-sphere', { radius: 0.05, position: '0.4 0 0', material: 'color: #cfcfcf' }, moonPivot);
        }
      });

      // Stars
      const stars = document.getElementById('stars');
      for (let i = 0; i < 250; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const d = 40;
        const x = d * Math.sin(phi) * Math.cos(theta);
        const y = d * Math.cos(phi);
        const z = d * Math.sin(phi) * Math.sin(theta);
        el('a-sphere', {
          radius: 0.08 + Math.random() * 0.1,
          position: x + ' ' + y + ' ' + z,
          material: 'shader: flat; color: #ffffff'
        }, stars);
      }
    }

    // Load A-Frame, trying several sources in turn
    const sources = [
      'https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js',
      'https://unpkg.com/aframe@1.5.0/dist/aframe.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js',
      'aframe.min.js'
    ];
    function loadAFrame(i) {
      if (i >= sources.length) {
        document.body.insertAdjacentHTML('beforeend',
          '<p style="color:#fff;font:20px sans-serif;padding:20px">Could not load A-Frame. Check the internet connection.</p>');
        return;
      }
      const s = document.createElement('script');
      s.src = sources[i];
      s.onload = init;
      s.onerror = () => loadAFrame(i + 1);
      document.head.appendChild(s);
    }
    loadAFrame(0);
  </script>
</body>
</html>
