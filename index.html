<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar System VR</title>
  <style>
    html, body { margin: 0; background: #02030a; color: #fff; font: 16px sans-serif; }
    #msg { position: fixed; left: 0; right: 0; top: 0; padding: 12px; z-index: 9999; background: #5a1010; display: none; }
  </style>
</head>
<body>
  <div id="msg"></div>

  <script>
    // name, orbit radius, planet size, color, orbit duration (ms)
    const planets = [
      { n: 'Меркурий', r: 1.6, s: 0.10, c: '#a8a39a', t: 6000 },
      { n: 'Венера',   r: 2.4, s: 0.18, c: '#e0b47a', t: 9000 },
      { n: 'Земля',   r: 3.3, s: 0.20, c: '#3b7bd8', t: 12000, moon: true },
      { n: 'Марс',    r: 4.2, s: 0.14, c: '#c4553a', t: 16000 },
      { n: 'Юпитер', r: 5.7, s: 0.55, c: '#d1a77a', t: 24000 },
      { n: 'Сатурн',  r: 7.3, s: 0.46, c: '#e3cf94', t: 30000, ring: true },
      { n: 'Уран',  r: 8.7, s: 0.30, c: '#8fd8d8', t: 38000 },
      { n: 'Нептун', r: 9.8, s: 0.29, c: '#4a63d9', t: 46000 }
    ];

    const msg = document.getElementById('msg');
    function showMessage(text) {
      msg.style.display = 'block';
      msg.textContent = text;
    }
    window.addEventListener('error', e => showMessage('Error: ' + e.message));

    function el(tag, attrs, parent) {
      const e = document.createElement(tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }

    // Text drawn on a canvas: no external font files, Russian letters work
    function makeLabel(text, w, h, color) {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = Math.round(1024 * h / w);
      const ctx = c.getContext('2d');
      let fs = c.height * 0.6;
      ctx.font = 'bold ' + fs + 'px Arial, sans-serif';
      while (ctx.measureText(text).width > c.width * 0.92 && fs > 10) {
        fs -= 2;
        ctx.font = 'bold ' + fs + 'px Arial, sans-serif';
      }
      ctx.fillStyle = color || '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, c.width / 2, c.height / 2);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, side: THREE.DoubleSide })
      );
      return mesh;
    }

    // Label that always faces the viewer
    function label(text, y, parent, w) {
      const e = el('a-entity', { position: '0 ' + y + ' 0', 'look-at': '[camera]' }, parent);
      e.setObject3D('mesh', makeLabel(text, w || 1.1, 0.28));
    }

    // The whole scene is built here, after A-Frame has loaded
    function init() {
      const scene = el('a-scene', { background: 'color: #02030a' });

      // Light
      el('a-entity', { light: 'type: ambient; color: #556; intensity: 0.9' }, scene);
      el('a-entity', {
        position: '0 1.5 -11',
        light: 'type: point; color: #fff2cc; intensity: 2.2; distance: 80; decay: 1'
      }, scene);

      // Titles
      const t1 = el('a-entity', { position: '0 2.7 -3' }, scene);
      t1.setObject3D('mesh', makeLabel('Солнечная система', 3, 0.6, '#ffffff'));
      const t2 = el('a-entity', { position: '0 2.25 -3' }, scene);
      t2.setObject3D('mesh', makeLabel('Ходите вокруг и смотрите ближе', 3.4, 0.3, '#9aa7c7'));

      // Camera
      const rig = el('a-entity', { position: '0 0 0' }, scene);
      el('a-camera', { position: '0 1.6 0' }, rig);

      // Solar system
      const system = el('a-entity', { position: '0 1.5 -11' }, scene);
      const sun = el('a-sphere', { radius: 0.9, material: 'shader: flat; color: #ffcc33' }, system);
      label('Солнце', 1.3, sun, 1.6);

      planets.forEach(p => {
        const pivot = el('a-entity', {
          animation: 'property: rotation; to: 0 360 0; dur: ' + p.t + '; easing: linear; loop: true'
        }, system);

        // Orbit line
        el('a-ring', {
          'radius-inner': p.r - 0.01, 'radius-outer': p.r + 0.01,
          rotation: '-90 0 0',
          material: 'color: #3a4468; opacity: 0.5; transparent: true; side: double'
        }, system);

        const planet = el('a-sphere', {
          radius: p.s, position: p.r + ' 0 0',
          material: 'color: ' + p.c + '; roughness: 1'
        }, pivot);
        planet.setAttribute('animation__spin',
          'property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true');

        label(p.n, p.s + 0.3, planet);

        if (p.ring) {
          el('a-ring', {
            'radius-inner': p.s * 1.4, 'radius-outer': p.s * 2.2,
            rotation: '-70 0 0',
            material: 'color: #cbb98a; side: double; opacity: 0.85; transparent: true'
          }, planet);
        }

        if (p.moon) {
          const moonPivot = el('a-entity', {
            animation: 'property: rotation; to: 0 360 0; dur: 3000; easing: linear; loop: true'
          }, planet);
          el('a-sphere', { radius: 0.05, position: '0.4 0 0', material: 'color: #cfcfcf' }, moonPivot);
        }
      });

      // Stars
      for (let i = 0; i < 250; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const d = 40;
        el('a-sphere', {
          radius: 0.08 + Math.random() * 0.1,
          position: (d * Math.sin(phi) * Math.cos(theta)) + ' ' + (d * Math.cos(phi)) + ' ' + (d * Math.sin(phi) * Math.sin(theta)),
          material: 'shader: flat; color: #ffffff'
        }, scene);
      }

      document.body.appendChild(scene);
    }

    // Load A-Frame, trying several sources in turn
    const sources = [
      'https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js',
      'https://unpkg.com/aframe@1.5.0/dist/aframe.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js',
      'aframe.min.js'
    ];
    function loadAFrame(i) {
      if (i >= sources.length) {
        showMessage('Could not load A-Frame. Check the internet connection.');
        return;
      }
      const s = document.createElement('script');
      s.src = sources[i];
      s.onload = init;
      s.onerror = () => loadAFrame(i + 1);
      document.head.appendChild(s);
    }
    loadAFrame(0);
  </script>
</body>
</html>
